<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>단어장</title>
<style>
:root{--bg:#fff4f0;--card:#fff;--ink:#5a4040;--sub:#a58a8a;--pink:#ff8fab;--pink2:#ffd6e0;--mint:#7fd8be;--mint2:#d5f5ea;--sun:#ffd166;--sun2:#fff0c2;--bad:#ff7a7a;--sh:0 6px 0 rgba(0,0,0,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2024;--card:#3a2c32;--ink:#ffe9ee;--sub:#c9a9b3;--pink2:#5a3342;--mint2:#254a40;--sun2:#4d4020;--sh:0 6px 0 rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#2a2024;--card:#3a2c32;--ink:#ffe9ee;--sub:#c9a9b3;--pink2:#5a3342;--mint2:#254a40;--sun2:#4d4020;--sh:0 6px 0 rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:30px;margin:8px 0 2px;text-align:center}
.sub{text-align:center;color:var(--sub);margin:0 0 18px}
.mascot{font-size:64px;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.big{display:block;width:100%;border:0;border-radius:28px;padding:20px;margin:14px 0;font:inherit;color:var(--ink);text-align:left;box-shadow:var(--sh);cursor:pointer}
.big:active,.btn:active,.day:active{transform:translateY(3px);box-shadow:none}
.big .t{font-size:26px}.big .e{font-size:44px;float:right}
.bar{height:12px;background:rgba(255,255,255,.7);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);opacity:.35;border-radius:9px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:0;background:var(--card);border-radius:50%;width:44px;height:44px;font-size:20px;box-shadow:var(--sh);color:var(--ink);cursor:pointer}
.top b{font-size:22px;flex:1}
.seg{display:flex;background:var(--card);border-radius:22px;padding:5px;gap:5px;margin:10px 0 14px;box-shadow:var(--sh)}
.seg button{flex:1;border:0;border-radius:18px;padding:12px;font:inherit;background:transparent;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--c);color:#5a4040}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.day{border:0;border-radius:20px;padding:12px 4px;font:inherit;background:var(--card);color:var(--ink);box-shadow:var(--sh);cursor:pointer}
.day small{display:block;color:var(--sub);font-size:12px}
.day.done{background:var(--c)}
.btn{border:0;border-radius:24px;padding:16px;font:inherit;font-size:19px;box-shadow:var(--sh);cursor:pointer;color:#5a4040}
.wide{width:100%;margin:10px 0}
.prog{text-align:center;color:var(--sub);margin:6px 0}
.flash{background:var(--card);border-radius:32px;box-shadow:var(--sh);min-height:300px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;margin:10px 0 16px;border:4px dashed var(--c)}
.word{font-size:48px;word-break:break-all}
.hint{color:var(--sub);margin-top:14px}
.chip{display:inline-block;background:var(--sun2);border-radius:14px;padding:6px 12px;margin:4px;font-size:18px}
.mean{font-size:30px;color:var(--ink);background:var(--mint2);border-radius:20px;padding:8px 18px;margin-top:12px}
.say{border:0;background:var(--mint2);border-radius:50%;width:64px;height:64px;font-size:30px;margin-top:14px;cursor:pointer}
a.look{display:inline-block;margin-top:14px;background:var(--pink2);color:var(--ink);padding:10px 16px;border-radius:18px;text-decoration:none}
.row{display:flex;gap:12px}.row .btn{flex:1}
input.ans{width:100%;font:inherit;font-size:32px;text-align:center;padding:14px;border-radius:24px;border:4px solid var(--c);background:var(--card);color:var(--ink);outline:none;margin:6px 0 10px}
.ok{color:#2fa57f;font-size:26px}.no{color:var(--bad);font-size:26px}
.res{text-align:center;padding-top:20px}.res .mascot{font-size:90px}

:root{--bg:#f7f8fa;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--pink2:#eef1f6;--mint:#2f6fed;--mint2:#eef3ff;--sun:#1f2937;--sun2:#f1f3f7;--sh:0 1px 2px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--ink:#f3f4f6;--sub:#9ca3af;--line:#2d3139;--pink2:#262a32;--mint2:#1f2a44;--sun2:#262a32;--sh:none}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--ink:#f3f4f6;--sub:#9ca3af;--line:#2d3139;--pink2:#262a32;--mint2:#1f2a44;--sun2:#262a32;--sh:none}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Pretendard",system-ui,sans-serif;font-weight:500}
h1{font-size:26px;text-align:left;margin:20px 0 4px}.sub{text-align:left}
.big{border:1px solid var(--line);background:var(--card)!important;border-radius:16px;box-shadow:var(--sh);padding:18px 20px;font-size:15px;color:var(--sub)}
.big .t{font-size:22px;color:var(--ink);font-weight:700}.big .e{display:none}.bar{background:var(--line);height:6px}.bar i{background:var(--mint);opacity:1}
.back{border:1px solid var(--line);border-radius:12px;box-shadow:none;width:40px;height:40px}.top b{font-size:18px}
.seg{border:1px solid var(--line);border-radius:12px;box-shadow:none;padding:4px}.seg button{border-radius:9px}.seg button.on{background:var(--mint);color:#fff}
.day{border:1px solid var(--line);border-radius:12px;box-shadow:none;font-size:17px;padding:12px 2px}.day.done{background:var(--mint2);border-color:var(--mint);color:var(--mint)}
.btn{border:1px solid var(--line);border-radius:12px;box-shadow:none;font-size:16px;padding:14px;color:var(--ink);background:var(--card)!important}
.btn.p,.row .btn:last-child,.wide.p{background:var(--mint)!important;color:#fff;border-color:var(--mint)}
.big:active,.btn:active,.day:active{transform:none;opacity:.7}
.flash{border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);background:var(--card)}.word{font-size:44px;font-weight:700}
.chip{background:var(--sun2);border-radius:8px;font-size:15px}.mean{background:none;padding:0;font-size:26px;color:var(--mint);font-weight:700}
.say{background:var(--mint2);color:var(--mint);font-size:24px}a.look{background:var(--sun2);border-radius:10px;font-size:14px;color:var(--sub)}
input.ans{border:2px solid var(--line);border-radius:14px;font-size:28px}input.ans:focus{border-color:var(--mint)}
.res .mascot{display:none}.res{padding-top:30px;text-align:left}
</style>
</head>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const cnt=l=>D[l].filter(x=>K[l][x[0]]).length;

function home(){
  S.fb=null;
  $.innerHTML=`<h1>영어 단어장</h1><p class="sub">초등 800 · 중고공통 1,200</p>`+

function days(l){
  S.lv=l;const L=LV[l],n=Math.ceil(D[l].length/PER);let g="";

function start(d){

function card(){

  if(!S.flip)say(w[0]);
}
function mark(ok){
  const w=S.list[S.i];
  if(ok){K[S.lv][w[0]]=1;S.right++}else{delete K[S.lv][w[0]];S.wrong.push(w[0])}
  save();S.i++;S.flip=false;card();
}
function quiz(){
  if(S.i>=S.list.length)return result();
  const w=S.list[S.i],L=LV[S.lv],f=S.fb;
  $.innerHTML=`<div class="top"><button class="back" onclick="days(${S.lv})">←</button><b>${S.title}</b></div>
  <div class="prog">${S.i+1} / ${S.list.length}</div>
  <div class="flash" style="--c:${L.c};cursor:default"><div class="hint" style="margin:0 0 6px">잘 듣고 스펠링을 써 보세요</div>
  <button class="say" style="width:96px;height:96px;font-size:44px" onclick="say('${esc(w[0])}')">♪</button>
  ${w[3]?`<div class="mean">${esc(w[3])}</div>`:""}<div class="hint">${w[0].length}글자 · 첫 글자 <b>${esc(w[0][0])}</b></div>
  ${f?(f.ok?`<div class="ok">딩동댕! <br>${esc(w[0])}</div>`:`<div class="no">아쉬워요 <br>정답: ${esc(w[0])}</div>`):""}</div>
  ${f?`<button class="btn wide p" onclick="S.i++;S.fb=null;quiz()">다음 ➜</button>`:
  `<input class="ans" id="a" style="--c:${L.c}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 쓰기"><button class="btn wide p" onclick="chk()">확인 ✔</button>`}`;
  const a=document.getElementById("a");
  if(a){a.focus();a.onkeydown=e=>{if(e.key=="Enter")chk()}}
  if(!f)say(w[0]);
}
function chk(){
  const w=S.list[S.i],v=document.getElementById("a").value.trim().toLowerCase();
  if(!v)return;
  const ok=v==w[0].toLowerCase();
  if(ok){K[S.lv][w[0]]=1;S.right++}else{delete K[S.lv][w[0]];S.wrong.push(w[0])}
  save();S.fb={ok};quiz();
}
function result(){
  const n=S.list.length,p=S.right/n;
  $.innerHTML=`<div class="res"><div class="mascot">${p==1?"":p>=.6?"":""}</div><h1>${p==1?"완벽해요!":p>=.6?"참 잘했어요!":"조금만 더 힘내요!"}</h1>
  <p class="sub">${n}개 중 ${S.right}개 알고 있어요 ✓</p>
  ${S.wrong.length?`<div>${S.wrong.map(w=>`<span class="chip">${esc(w)}</span>`).join("")}</div>`:""}
  <button class="btn wide p" onclick="days(${S.lv})">다른 Day 하러 가기</button>
  <button class="btn wide" style="background:var(--sun)" onclick="home()">처음으로 </button></div>`;
}
home();
</script>
</body>
</html>
